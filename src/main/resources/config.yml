  deposit-success: '&aDepositaste &e%money%₯ &aen tu banco.'
  withdraw-success: '&aRetiraste &e%money%₯ &ade tu banco.'
  enter-amount: '&6Ingresa la cantidad a procesar:'
  custom-amount-not-set: '&cSesión cancelada.'

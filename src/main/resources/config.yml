# sBank — configurado para DrakesCraft
# Docs: https://github.com/xenrivehub/sbank

database:
  type: sqlite
  host: localhost
  port: 3306
  name: sbank
  username: root
  password: ''

# Guardado automático de cuentas y deudas en base de datos
auto-save: 
  save-interval: 15
  log-settings:
    enabled: true
    message: "&6[DrakesBank]&a Todas las cuentas y deudas se guardaron correctamente."

# Registro de auditoría JSON
audit:
  enabled: true
  directory: "audit"

default-bank-name: "Mi Banco"
bank-name-length: 16
start-money: 0
currency-symbol: "₯"

# --- PENALIZACIÓN POR MUERTE -----------------------------
# El dinero en el banco (depositado) está SEGURO siempre.
# Opción A (Sugerencia #1): Desactivado cobro por muerte ambiental/caída.
lose-money-after-death: false
after-death-percentage: 0
after-death-message: '&c¡Moriste! Tu dinero en mano está seguro. Recuerda usar el banco (/sb) para mayor comodidad.'


  bank-name-invalid: '&cNombre inválido. Solo letras y números. (escribe ''close'' para cancelar)'
  loan-amount: '&6Ingresa el monto del préstamo. Mínimo &e%minloan%₯ &6y Máximo &e%maxloan%₯. &o(escribe ''cancel'' para cancelar)'
  loan-agreement: '&6Se te cobrará &c%interest%₯ de interés cada &c%term% horas. ¿Confirmas el préstamo de &e%amount%₯?'
  loan-success: '&aPréstamo aprobado: &e%amount%₯. &aPagarás &c%interest%₯ de interés cada &c%term% horas. Usa &e/sb debt &apara ver tu deuda.'
  loan-failed: '&cProceso de préstamo cancelado.'
  loan-paid: '&aPagaste &e%amount%₯ &ahacia tu deuda.'
  loan-cancelled: '&cProceso de préstamo cancelado.'
  loan-disabled: '&cLos préstamos están desactivados.'
  loan-amount-error: '&cEl monto debe estar entre &e%minloan%₯ &cy &e%maxloan%₯.'

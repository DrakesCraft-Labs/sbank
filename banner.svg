<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="sBank Banner">
  <defs>
    <linearGradient id="bFondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="bHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="920" height="240" rx="16" fill="url(#bFondo)"/>
  <rect width="920" height="240" rx="16" fill="url(#bHalo)"/>
  <rect x="2" y="2" width="916" height="236" rx="14" fill="none" stroke="url(#acG)" stroke-width="2" opacity="0.4"/>

  <!-- Banco: fronton, columnas y base -->
  <g transform="translate(460,70) scale(1.6)">
    <path d="M-30,-10 L0,-26 L30,-10 Z" fill="none" stroke="url(#acG)" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-30" y="-10" width="60" height="5" rx="1.5" fill="#F59E0B"/>
    <rect x="-24" y="-2" width="6" height="18" rx="1" fill="#FDE68A" opacity="0.9"/>
    <rect x="-12" y="-2" width="6" height="18" rx="1" fill="#FDE68A" opacity="0.9"/>
    <rect x="0" y="-2" width="6" height="18" rx="1" fill="#FDE68A" opacity="0.9"/>
    <rect x="12" y="-2" width="6" height="18" rx="1" fill="#FDE68A" opacity="0.9"/>
    <rect x="-32" y="18" width="64" height="6" rx="2" fill="#F59E0B"/>
    <!-- Dragma -->
    <circle cx="36" cy="-18" r="9" fill="url(#coin)" stroke="#FFFBEB" stroke-width="1.5"/>
    <text x="36" y="-14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="900" fill="#78350F">₯</text>
  </g>

  <text x="460" y="152" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#F8FAFC" letter-spacing="2">
    SBANK
  </text>
  <text x="460" y="184" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#FDE68A" letter-spacing="3" opacity="0.9">
    BANCA DE DRAGMAS · INTERESES · PRÉSTAMOS · IMPUESTO A LA RIQUEZA
  </text>

  <g transform="translate(460, 210)">
    <rect x="-180" y="-12" width="110" height="20" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="-125" y="2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#E2E8F0">DRAKES LABS</text>

    <rect x="-55" y="-12" width="110" height="20" rx="4" fill="#1E293B" stroke="#FDE68A" stroke-width="1"/>
    <text x="0" y="2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#E2E8F0">PAPER 1.21.11</text>

    <rect x="70" y="-12" width="110" height="20" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="125" y="2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#E2E8F0">VAULT · JAVA 21</text>
  </g>
